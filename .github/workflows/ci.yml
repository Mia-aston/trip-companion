name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: trip_companion_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/trip_companion_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/trip_companion_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: OpenAPI contract is committed and current
        run: python scripts/export_openapi.py --check
      - name: Migrations have no pending model changes
        run: alembic upgrade head && alembic check && alembic downgrade base
      - name: Tests (unit + PostGIS)
        run: pytest -q -rs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated TS types match openapi.json
        run: npm run gen:types && git diff --exit-code -- src/types/api.gen.ts
      - name: Typecheck
        run: npm run typecheck

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: trip_companion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/trip_companion
      E2E_API_CMD: uvicorn app.main:app --port 8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: API deps + schema
        working-directory: services/api
        run: pip install -e . && alembic upgrade head
      - name: Web deps + build
        working-directory: apps/web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium && npm run build
      - name: Playwright (desktop + phone)
        working-directory: apps/web
        run: npm run e2e
